<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot con IA</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:20px}
  #chat{width:100%;max-width:480px;background:#fff;border-radius:12px;box-shadow:0 2px 8px #0002;display:flex;flex-direction:column;height:80vh}
  h1{font-size:18px;margin:0;padding:14px 16px;border-bottom:1px solid #ddd}
  #mensajes{flex:1;overflow-y:auto;padding:16px}
  .msg{margin:8px 0;padding:10px 14px;border-radius:14px;max-width:80%;white-space:pre-wrap}
  .user{background:#0b79f7;color:#fff;margin-left:auto}
  .bot{background:#e9ebef}
  #barra{display:flex;border-top:1px solid #ddd}
  #entrada{flex:1;border:0;padding:14px;font-size:16px;outline:none}
  button{border:0;background:#0b79f7;color:#fff;padding:0 20px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="chat">
  <h1>🤖 Asistente virtual</h1>
  <div id="mensajes"></div>
  <div id="barra">
    <input id="entrada" placeholder="Escribe tu mensaje..." autocomplete="off">
    <button id="enviar">Enviar</button>
  </div>
</div>

<script>
const URL_BACKEND = "https://script.google.com/macros/s/AKfycbyB4PHSYNpCYcD9QUVtXWO6eejN4JWAfvwhkiD4hTinwENixItDXoF-2LytPzevqlFd/exec";
let historial = [];
const caja = document.getElementById("mensajes");
const entrada = document.getElementById("entrada");

function agregar(texto, clase) {
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.textContent = texto;
  caja.appendChild(d);
  caja.scrollTop = caja.scrollHeight;
  return d;
}

async function enviar() {
  const texto = entrada.value.trim();
  if (!texto) return;
  entrada.value = "";
  agregar(texto, "user");
  const espera = agregar("Escribiendo...", "bot");
  try {
    const r = await fetch(URL_BACKEND, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ mensaje: texto, historial })
    });
    const datos = await r.json();
    if (datos.respuesta) {
      espera.textContent = datos.respuesta;
      historial.push({ role: "user", parts: [{ text: texto }] });
      historial.push({ role: "model", parts: [{ text: datos.respuesta }] });
    } else {
      espera.textContent = datos.error || "Ocurrió un error.";
    }
  } catch (e) {
    espera.textContent = "No pude conectar con el servidor.";
  }
}

document.getElementById("enviar").onclick = enviar;
entrada.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });
agregar("¡Hola! Soy el asistente virtual. ¿En qué te puedo ayudar?", "bot");
</script>
</body>
</html>
